services:
  - type: web
    name: divai
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TIDB_HOST
        sync: false
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: ia_html_generator
      - key: TIDB_CA_PATH
        value: tidb-ca.pem
